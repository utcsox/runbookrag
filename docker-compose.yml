services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runbookrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runbookrag}
      POSTGRES_DB: ${POSTGRES_DB:-runbookrag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-runbookrag} -d ${POSTGRES_DB:-runbookrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-runbookrag}:${POSTGRES_PASSWORD:-runbookrag}@db:5432/${POSTGRES_DB:-runbookrag}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
